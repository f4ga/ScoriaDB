version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - io/ioutil.ReadFile
        - io/ioutil.WriteFile
        - os.RemoveAll
        - fmt.Println
        - fmt.Printf

    staticcheck:
      checks:
        - all
        - -SA1019

    govet:
      enable:
        - asmdecl
        - assign
        - atomic
        - bools
        - buildtag
        - cgocall
        - composites
        - copylocks
        - deepequalerrors
        - errorsas
        - fieldalignment
        - findcall
        - framepointer
        - httpresponse
        - ifaceassert
        - loopclosure
        - lostcancel
        - nilfunc
        - nilness
        - printf
        - shift
        - sigchanyzer
        - stdmethods
        - stringintconv
        - structtag
        - testinggoroutine
        - tests
        - unmarshal
        - unreachable
        - unsafeptr
        - unusedresult

  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - unused
      - path: internal/engine/benchmark_
        linters:
          - errcheck
          - unused
      - path: internal/engine/sstable/
        linters:
          - staticcheck
      - path: pkg/scoria/benchmark_test\.go
        linters:
          - unused
      - path: cmd/
        linters:
          - errcheck
      - text: "SA1019"
        linters:
          - staticcheck
      - text: "Error return value is not checked"
        linters:
          - errcheck
      - text: "unused-parameter"
        linters:
          - unused
      - text: "fieldalignment"
        linters:
          - govet

run:
  timeout: 5m
  tests: true

issues:
  max-same-issues: 5
  max-issues-per-linter: 10
