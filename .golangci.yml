version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - io/ioutil.ReadFile
        - io/ioutil.WriteFile

  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

run:
  timeout: 3m
  tests: true
