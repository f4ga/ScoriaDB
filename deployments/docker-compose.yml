version: '3.8'
services:
  server:
    build:
      context: ../
      dockerfile: deployments/Dockerfile.server
    image: scoriadb-server:latest
    container_name: scoriadb-server
    ports:
      - "50051:50051"
      - "8080:8080"
    volumes:
      - scoria-data:/data
    environment:
      JWT_SECRET: "change-me-in-production"
    restart: unless-stopped

  cli-test:
    build:
      context: ../
      dockerfile: deployments/Dockerfile.cli
    image: scoriadb-cli:latest
    container_name: scoriadb-cli-test
    depends_on:
      - server
    entrypoint: |
      /bin/sh -c "
        sleep 5 &&
        TOKEN=\$$(scoria --addr server:50051 admin auth admin admin) &&
        echo 'Token obtained: '\$$TOKEN &&
        scoria --addr server:50051 --token \$$TOKEN set hello world &&
        scoria --addr server:50051 --token \$$TOKEN get hello &&
        echo 'CLI integration test passed'
      "
    restart: "no"

volumes:
  scoria-data: